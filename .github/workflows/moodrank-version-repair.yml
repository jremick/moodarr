name: Temporary MoodRank version-contract repair
on:
  pull_request:
    paths:
      - .github/workflows/moodrank-version-repair.yml
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'jremick/moodarr' && github.event.pull_request.head.repo.full_name == 'jremick/moodarr' && github.event.pull_request.head.ref == 'fix/moodrank-correctness-2026-09-08' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact version assertions and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const files = [
            ['tests/app.test.ts', '52d6b63224c6fc403fc609cc5d8f1687a05508b3', 3],
            ['tests/recommendation.test.ts', '1d27f68d4828740adf36704f447dd4ef74eac629', 1]
          ];
          for (const [path, hash, count] of files) {
            const bytes = readFileSync(path);
            assert.equal(createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'), hash, `${path}: source changed`);
            const source = bytes.toString('utf8');
            const old = 'engineVersion: "moodrank-v0.5"';
            assert.equal(source.split(old).length - 1, count, `${path}: unexpected replacement count`);
            writeFileSync(path, source.replaceAll(old, 'engineVersion: "moodrank-v0.5.1"'));
          }
          unlinkSync('.github/workflows/moodrank-version-repair.yml');
          NODE
          git diff --check
          git diff --stat
      - name: Validate real affected suites
        run: npm test -- tests/app.test.ts tests/recommendation.test.ts tests/moodFeaturePolarity.test.ts tests/queryCuePolarity.test.ts
      - name: Commit only the checked branch repair
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          branch=fix/moodrank-correctness-2026-09-08
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          test "$(git -c "http.https://github.com/.extraheader=$header" ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/app.test.ts tests/recommendation.test.ts .github/workflows/moodrank-version-repair.yml
          git commit -m 'test(moodrank): align version assertions with v0.5.1'
          git -c "http.https://github.com/.extraheader=$header" push origin "HEAD:refs/heads/$branch"
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
