name: Temporary verified MoodRank completion workspace
on:
  pull_request:
    paths:
      - .github/workflows/moodrank-completion-workspace.yml
      - scripts/.moodrank-completion-*.b64
permissions:
  contents: read
concurrency:
  group: moodrank-completion-workspace
  cancel-in-progress: true
jobs:
  workspace:
    if: github.repository == 'jremick/moodarr' && github.event.pull_request.head.repo.full_name == 'jremick/moodarr' && github.event.pull_request.head.ref == 'fix/moodrank-completion-2026-09-08' && github.event.pull_request.base.ref == 'fix/moodrank-intent-ranking-2026-09-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact payload and unchanged source before applying
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          const encoded = [1,2,3,4,5,6].map(i => readFileSync(`scripts/.moodrank-completion-${i}.b64`, 'utf8').trim()).join('');
          const patch = gunzipSync(Buffer.from(encoded, 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '8841445fbd85528dc099e1b7cdbf7c67624d7cc8009dab818e82c9900f3256a4') throw new Error('patch_hash_mismatch');
          writeFileSync(process.env.RUNNER_TEMP + '/moodrank-completion.patch', patch);
          NODE
          rm scripts/.moodrank-completion-{1,2,3,4,5,6}.b64 .github/workflows/moodrank-completion-workspace.yml
          test ! -e .github/workflows/moodrank-completion-source.yml
          git diff --exit-code f4b6ce5eaee6b2f441444348664607fe2a9e5963 -- .
          git apply --check "$RUNNER_TEMP/moodrank-completion.patch"
          git apply "$RUNNER_TEMP/moodrank-completion.patch"
          git diff --check
      - name: Commit clean candidate for source-provenance verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(moodrank): resolve ranking regressions and complete offline evaluation preparation'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/moodrank-completion-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/moodrank-completion-evidence/implementation-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/moodrank-completion-evidence/tree-sha.txt"
          node --version > "$RUNNER_TEMP/moodrank-completion-evidence/node-version.txt"
      - name: Run complete verification and established evaluation gates
        shell: bash
        env:
          MOODARR_SECRETS_REQUIRE_BUILD: 'true'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/moodrank-completion-evidence"
          npm run verify 2>&1 | tee "$evidence/verify.log"
          npm run eval:recommendations 2>&1 | tee "$evidence/recommendations.log"
          npm run eval:moodrank-release-readiness 2>&1 | tee "$evidence/readiness.log"
          npm run eval:profile-journeys 2>&1 | tee "$evidence/journeys.log"
      - name: Measure eight visible arms and synthetic final-response latency
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/evaluate-ranking-ablations.ts > "$RUNNER_TEMP/moodrank-completion-evidence/ranking-ablations.json"
          node --import tsx scripts/benchmark-ranking-candidate.ts > "$RUNNER_TEMP/moodrank-completion-evidence/ranking-benchmark.json"
          cd "$RUNNER_TEMP/moodrank-completion-evidence"
          sha256sum *.log *.json *.txt > SHA256SUMS
      - name: Publish only to the unchanged named branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          branch=fix/moodrank-completion-2026-09-08
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          test "$(git -c "http.https://github.com/.extraheader=$header" ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=$header" push origin "HEAD:refs/heads/$branch"
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: moodrank-completion-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/moodrank-completion-evidence
          retention-days: 7
          if-no-files-found: warn
