name: MCP adapter

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mcp-cloudflare/**
      - apps/chatgpt-ui/**
      - src/server/**
      - src/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/mcp.yml
  push:
    branches: [main]
    paths:
      - apps/mcp-cloudflare/**
      - apps/chatgpt-ui/**
      - src/server/**
      - src/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/mcp.yml

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mcp-cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/mcp-cloudflare/package-lock.json
            apps/chatgpt-ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
      - name: Install and lint the ChatGPT component
        run: |
          npm ci --ignore-scripts --prefix ../chatgpt-ui
          npm run audit:allowlisted --prefix ../chatgpt-ui
          npm run lint --prefix ../chatgpt-ui
      - run: npm run verify
      - name: Install the actual Moodarr API for contract verification
        run: npm ci --ignore-scripts --prefix ../..
      - run: npm run test:api
      - name: Save synthetic Worker journey receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moodarr-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mcp-cloudflare/artifacts/worker-http.json
          if-no-files-found: error
