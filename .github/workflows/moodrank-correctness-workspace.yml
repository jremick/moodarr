name: Temporary MoodRank correctness workspace
on:
  pull_request:
    paths:
      - .github/workflows/moodrank-correctness-workspace.yml
      - scripts/moodrank-correctness-workspace.mjs
permissions:
  contents: read
concurrency:
  group: moodrank-correctness-workspace
  cancel-in-progress: true
jobs:
  workspace:
    if: github.repository == 'jremick/moodarr' && github.event.pull_request.head.repo.full_name == 'jremick/moodarr' && github.event.pull_request.head.ref == 'fix/moodrank-evidence-correctness-2026-09-08' && github.event.pull_request.base.ref == 'fix/moodrank-correctness-2026-09-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record baseline failures against actual production imports
        shell: bash
        run: |
          set +e
          npm test -- tests/moodrankCorrectness.test.ts --reporter=json --outputFile="$RUNNER_TEMP/moodrank-correctness-baseline.json"
          result=$?
          set -e
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/moodrank-correctness-baseline.json', 'utf8'));
          console.log('BASELINE_COUNTS', JSON.stringify({passed: result.numPassedTests, failed: result.numFailedTests, total: result.numTotalTests}));
          for (const file of result.testResults) for (const assertion of file.assertionResults) if (assertion.status === 'failed') console.log('BASELINE_FAILURE', assertion.fullName);
          if (!result.numFailedTests) throw new Error('The intended baseline failures did not reproduce. Inspect before proceeding.');
          NODE
          test "$result" -ne 0
      - name: Apply reviewed patches with original-content guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/moodrank-correctness-workspace.mjs
          git diff --check
      - name: Run focused production and refresh regressions
        run: npm test -- tests/moodrankCorrectness.test.ts tests/moodrankCorrectnessRefresh.test.ts tests/documentaryPolicy.test.ts tests/queryCuePolarity.test.ts tests/moodFeaturePolarity.test.ts
      - name: Make a clean local candidate and remove temporary workspace files
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm scripts/moodrank-correctness-workspace.mjs .github/workflows/moodrank-correctness-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/recommendation/features.ts src/server/recommendation/contentFingerprint.ts src/server/recommendation/feelProfile.ts src/server/recommendation/scoring.ts src/server/recommendation/version.ts src/server/db/mediaRepository.ts tests/app.test.ts tests/recommendation.test.ts docs/MOODRANK_CURRENT_ALGORITHMS.md docs/MOODRANK_REMEDIATION_2026_09.md scripts/moodrank-correctness-workspace.mjs .github/workflows/moodrank-correctness-workspace.yml
          git diff --cached --check
          git commit -m 'fix(moodrank): ground content cues and preserve requested viewing intent'
          test -z "$(git status --porcelain)"
      - name: Run full developer verification and existing recommendation gates
        env:
          MOODARR_SECRETS_REQUIRE_BUILD: "true"
        run: npm run verify && npm run eval:recommendations && npm run eval:moodrank-release-readiness && npm run eval:profile-journeys
      - name: Publish verified local candidate only to the unchanged working branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          branch=fix/moodrank-evidence-correctness-2026-09-08
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          test "$(git -c "http.https://github.com/.extraheader=$header" ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=$header" push origin "HEAD:refs/heads/$branch"
          echo "PATCHED_COMMIT=$(git rev-parse HEAD)"
